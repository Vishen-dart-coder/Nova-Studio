<script>
(function(){
  var pre=document.getElementById('art'),reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
  var RAMP=' .·:-=+*#%@',mouse={x:-9,y:-9,on:false},cols,rows,mask,cell=10,raf=0,vis=true;
  var off=document.createElement('canvas'),octx=off.getContext('2d');
  function build(){
    var w=Math.min(window.innerWidth-40,1100);
    cell=w<520?Math.floor(w/36):w<900?8:10;pre.style.fontSize=cell+'px';
    cols=Math.max(40,Math.floor(w/(cell*.6)));rows=Math.round(cols*(w<520?.5:.3));

    while(octx.measureText('404').width>cols*.94&&fs>6){fs-=1;octx.font='900 '+fs+'px "Arial Black",Impact,Arial,sans-serif'}

  }
  function h(x,y){var s=Math.sin(x*127.1+y*311.7)*43758.5453;return s-Math.floor(s)}
  function n(x,y){var xi=Math.floor(x),yi=Math.floor(y),xf=x-xi,yf=y-yi;xf=xf*xf*(3-2*xf);yf=yf*yf*(3-2*yf);
    return h(xi,yi)*(1-xf)*(1-yf)+h(xi+1,yi)*xf*(1-yf)+h(xi,yi+1)*(1-xf)*yf+h(xi+1,yi+1)*xf*yf}
  function frame(t){
    raf=0;var out='',k=t*.00035;
    for(var y=0;y<rows;y++){
      for(var x=0;x<cols;x++){
        var m=mask[y*cols+x],v;
        var f=n(x*.09+k*3,y*.16-k*2)*.6+n(x*.2-k*4,y*.3+k)*.4;
        if(m>.5){v=.62+f*.38}else{v=Math.max(0,(f-.72)*1.0)}

    pre.textContent=out;
    if(!reduce&&vis)raf=requestAnimationFrame(frame);

  if(!reduce){
    start();
    pre.addEventListener('pointermove',function(e){var r=pre.getBoundingClientRect();mouse.x=(e.clientX-r.left)/r.width*cols;mouse.y=(e.clientY-r.top)/r.height*rows;mouse.on=true});
